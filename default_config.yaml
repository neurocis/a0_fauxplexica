# Default configuration for A0_Fauxplexica plugin.
# Override per-project or per-agent via the plugin settings panel.

# Meta-search backend (BYO SearxNG instance — see README).
searxng_url: ""

# Default search depth/latency mode: speed | balanced | quality
default_mode: balanced

# Source category flags surfaced in the WebUI picker.
sources:
  web: true
  discussions: false
  academic: true

# Built-in widget toggles.
widgets_enabled:
  weather: true
  calculator: true
  stock: true

# Hard cap on sources retained per query after dedup/trust scoring.
max_sources_per_query: 12

# Citation rendering style: inline_bracket | footnote
citation_style: inline_bracket

# Model role overrides — leave empty to fall back to _model_config defaults.
# Actual preset wiring is handled later by _model_config; this skeleton
# documents the intended split (fast classifier / strong composer / utility).
model_overrides:
  classifier: ""
  composer: ""
  utility: ""

# --- PLAN_AMENDMENTS_R1.md §A11 additions ---

# Cap composer context to fit smaller local models.
context_budget_chars: 60000

# Reggie's quality-mode ReAct loop iteration cap (Vane uses 25; we throttle).
quality_max_iterations: 10

# Per-page semaphore for the chunked extractor LLM (improves on Vane's unbounded Promise.all).
scrape_extractor_concurrency: 3

# Stock widget guardrails.
stock_comparison_max: 2
stock_cache_ttl_seconds: 300

# Embedding-based rerank thresholds (helpers/reranker.py).
rerank:
  cosine_keep_threshold: 0.5
  cosine_dedup_threshold: 0.75

# SearxNG client tuning (helpers/searxng_client.py).
searxng:
  pagination_pages: 1
  time_range_default: any

# WebUI / scraper toggles.
webui:
  scraper_fallback_playwright: false
